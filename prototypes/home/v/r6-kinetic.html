<style>
/* Kinetic: the most motion. Words arrive in sequence, one marquee of shows, artworks animate. */
:root { --bg: #100d0b; --wall: #17120f; --piece: #1d1713; }
.words .w { display: inline-block; opacity: 0; transform: translateY(0.45em); filter: blur(4px); transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out), filter 600ms var(--ease-out); transition-delay: calc(var(--i) * 16ms); }
.words.is-in .w { opacity: 1; transform: none; filter: none; }
.standfirst.words::first-letter { all: unset; }
.marquee { overflow: hidden; margin: 80px 0 0; padding: 20px 0; border-block: 1px solid var(--line); }
.marquee > div { display: flex; align-items: center; gap: 36px; width: max-content; animation: mq 46s linear infinite; }
.marquee span { font-family: "Antique Olive", sans-serif; font-weight: 900; font-size: clamp(44px, 6.4vw, 104px); letter-spacing: -0.03em; color: var(--unlit); white-space: nowrap; }
.marquee i { font-style: normal; font-size: 28px; color: var(--gel); }
@keyframes mq { to { transform: translateX(-50%); } }
.work .art { transform: translateY(30px) scale(0.96); filter: blur(6px); transition: opacity 1100ms var(--ease-out), transform 1100ms var(--ease-out), filter 1100ms var(--ease-out); }
.work.is-in .art { filter: none; }
@media (prefers-reduced-motion: reduce) { .work .art { filter: none; } }
</style>
</head>
<body data-fx="kinetic">
