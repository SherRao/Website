<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
/* Left: a sticky poster that changes with each chapter. Right: the story, on a dark page. */
@font-face { font-family: "Antique Olive"; src: url("../assets/antique-olive-black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
:root {
  --night: #0c0b0d; --paper: #f3f3f1; --ink: #111; --orange: #ff5b14; --gel: #ffe6c4; --unlit: #36313b;
  --cream: #efe7dc; --dim: rgba(239, 231, 220, 0.6); --faint: rgba(239, 231, 220, 0.22); --line: rgba(239, 231, 220, 0.1);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(20px, 2.6vw, 36px);
  --serif: "EB Garamond", Georgia, serif; --mono: "Geist Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--night); color: var(--cream); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.display { font-family: "Antique Olive", "Arial Black", sans-serif; font-weight: 900; letter-spacing: -0.035em; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.needed { display: inline-block; padding: 2px 8px; border: 1px dashed var(--faint); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

/* ---------- left: the sticky poster ---------- */
.left { position: sticky; top: 0; height: 100dvh; overflow: hidden; }
.panel { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: var(--pad); opacity: 0; pointer-events: none; transition: opacity 450ms var(--ease-out); }
.panel.is-on { opacity: 1; pointer-events: auto; }
.panel .meta { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 10px; border-bottom: 2px solid currentColor; }
.panel .big { align-self: end; margin: 0; line-height: 0.78; transform: translateY(28px); transition: transform 700ms var(--ease-out); }
.panel.is-on .big { transform: none; }
.panel .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-top: 14px; margin-top: 18px; border-top: 2px solid currentColor; }
.panel .foot h2 { margin: 0; font-size: clamp(30px, 2.8vw, 46px); font-weight: 400; font-style: italic; line-height: 1; }
.panel .foot p { margin: 0; max-width: 28ch; font-family: Geist, sans-serif; font-size: 14px; line-height: 1.4; text-align: right; }
.p-night { background: var(--night); color: var(--cream); }
.p-orange { background: var(--orange); color: var(--ink); }
.p-paper { background: var(--paper); color: var(--ink); }
.p-paper .big { color: var(--orange); }
.p-black { background: #050505; color: var(--cream); }
.p-black .big { color: var(--orange); }
.p-warm { background: radial-gradient(120% 90% at 50% 100%, #4a3828 0%, #231b15 55%, var(--night) 100%); color: var(--cream); }
.p-warm .big { color: var(--gel); }
.p-photo { color: var(--paper); background: var(--orange); }
.p-photo .big { color: var(--paper); }
.p-photo::before { content: ""; position: absolute; inset: 0; background: url("../assets/spurhacks-2.jpg") center / cover; filter: grayscale(1) contrast(1.15) brightness(0.85); mix-blend-mode: multiply; }
.p-photo > * { position: relative; }
.big.xl { font-size: min(34vw, 62vh); }
.big.lg { font-size: min(16vw, 30vh); }
.big.md { font-size: min(22vw, 40vh); }

/* the opening poster: followspot on the name */
.hero-panel { overflow: hidden; --spot-r: 220px; }
.name { margin: 0; font-size: min(10.5vw, 22vh); line-height: 0.8; display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; }
.name > span { display: block; }
.name .dot { color: var(--orange); }
.name--base { align-self: center; position: relative; z-index: 1; color: var(--unlit); user-select: none; }
.hero-panel.is-rm .name--base { color: var(--gel); }
.name--lit { color: var(--gel); }
.hero-panel .foot, .hero-panel .meta { position: relative; z-index: 3; }

/* ---------- right: the story ---------- */
.right { padding: 0 clamp(24px, 4vw, 72px); border-left: 1px solid var(--line); }
.right section { min-height: 100dvh; padding: 16vh 0 12vh; display: flex; flex-direction: column; justify-content: center; }
.right .label { color: var(--dim); }
.headline { margin: 14px 0 0; font-size: clamp(34px, 3.2vw, 52px); font-weight: 400; line-height: 1.04; }
.headline em { color: var(--gel); }
.standfirst { margin: 28px 0 0; font-size: 21px; line-height: 1.55; }
.contents { list-style: none; margin: 32px 0 0; padding: 0; border-top: 1px solid var(--faint); }
.contents a { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 20px; }
.contents .n { font-family: "Antique Olive", sans-serif; color: var(--orange); font-size: 15px; }
.contents a:hover em { color: var(--gel); }
.right h2.title { margin: 10px 0 0; font-size: clamp(40px, 4vw, 64px); line-height: 0.9; }
.text p { margin: 22px 0 0; font-size: 20px; line-height: 1.6; color: rgba(239, 231, 220, 0.86); }
.pull { margin: 36px 0 0; font-size: clamp(28px, 2.6vw, 40px); line-height: 1.12; font-style: italic; color: var(--gel); }
.box { margin-top: 40px; }
.box > .label { display: block; margin-bottom: 12px; }
.facts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--faint); font-family: Geist, sans-serif; font-size: 14px; }
.facts li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.facts b { font-weight: 500; }
.facts span { color: var(--dim); }
.built { --b-strong: var(--faint); --b-rule: var(--line); --b-accent: var(--orange); --b-on-accent: var(--ink); --b-dim: var(--dim); --b-mono: var(--mono); font-family: Geist, sans-serif; }
.built-row { grid-template-columns: 28px minmax(0, 1fr) 20px !important; gap: 4px 14px !important; }
.built-what, .built-meta { grid-column: 2; }
.built-go { grid-column: 3; grid-row: 1; }
.built-name { font-family: "Antique Olive", sans-serif; font-weight: 900; letter-spacing: -0.02em; font-size: 20px !important; }
a.built-row:hover .built-name { color: var(--gel); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.photos figure { margin: 0; }
.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.photos figcaption { margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.reveal { clip-path: inset(0 0 100% 0); transition: clip-path 900ms var(--ease-out); }
.reveal.is-in { clip-path: inset(0 0 0 0); }
.mail { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 16px; font-size: clamp(28px, 3.4vw, 56px); line-height: 1; text-decoration: none; color: var(--gel); }
.mail:hover { color: var(--orange); }
.elsewhere { display: flex; gap: 22px; margin-top: 22px; font-family: Geist, sans-serif; font-size: 14px; }
.elsewhere a { color: var(--dim); text-decoration: none; }
.elsewhere a:hover { color: var(--cream); }
.fine { margin-top: 64px; font-family: Geist, sans-serif; font-size: 12px; color: var(--dim); }
.m-panel { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1000px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .left { display: none; }
  .right { border-left: 0; padding: 0; }
  .right section { min-height: 0; padding: 0 20px 72px; }
  .m-panel { display: grid; grid-template-rows: auto 1fr auto; min-height: 70vh; margin: 0 -20px 40px; padding: 20px; position: relative; overflow: hidden; }
  .m-panel .big { transform: none; }
  .m-panel .meta { display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid currentColor; }
  .m-panel .foot p { display: none; }
  .big.xl { font-size: 60vw; } .big.lg { font-size: 26vw; } .big.md { font-size: 40vw; }
  .m-panel .name { font-size: 20vw; color: var(--gel); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
  .reveal { clip-path: none; }
}
</style>
</head>
<body>
<div class="split">
  <aside class="left" aria-hidden="true"></aside>
  <main class="right" id="app"></main>
</div>
<script>
const C = window.CONTENT, S = window.STORY;
const ch = (id) => S.chapters.find((c) => c.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;
const spur = C.events.find((e) => e.id === "spurhacks");
const nameHTML = `<span>nausher</span><span>rao<span class="dot">.</span></span>`;

// One poster per section: [section id, colour class, big text, size, chapter].
const POSTERS = [
  ["top", "p-night", null, null, null],
  ["engineer", "p-orange", "8", "xl", ch("engineer")],
  ["founder", "p-paper", "$1M+", "lg", ch("founder")],
  ["stage", "p-photo", "1,400", "lg", ch("stage")],
  ["band", "p-black", "tba", "md", ch("band")],
  ["hi", "p-warm", "say hi.", "lg", ch("hi")],
];
const panelInner = ([id, , big, size, c]) => id === "top"
  ? `<div class="meta label"><span>nausher rao</span><span>portfolio, 2026</span></div>
     <p class="name name--base display">${nameHTML}</p>
     <div class="foot"><h2>${S.headline[1]}</h2><p>${C.now.role} at ${C.now.org}. founder. stage manager. bandmate.</p></div>`
  : `<div class="meta label"><span>chapter ${c.n}.</span><span>${c.title}</span></div>
     <p class="big display ${size}">${big}</p>
     <div class="foot"><h2>${c.n}. ${c.title}</h2><p>${c.bigCap ? c.bigCap + "." : C.email}</p></div>`;

document.querySelector(".left").innerHTML = POSTERS.map((p) => `<div class="panel ${p[1]}${p[0] === "top" ? " hero-panel" : ""}" data-panel="${p[0]}">${p[0] === "top" ? `<div class="spot"></div><p class="name name--lit display" aria-hidden="true">${nameHTML}</p>` : ""}${panelInner(p)}</div>`).join("");
const mPanel = (id) => { const p = POSTERS.find((x) => x[0] === id); return `<div class="m-panel ${p[1]}" aria-hidden="true">${panelInner(p).replace("name--base", "")}</div>`; };
const text = (c) => `<div class="text">${c.paras.map((p) => `<p>${p}</p>`).join("")}${c.needed ? `<p><span class="needed">content needed</span></p>` : ""}</div>`;
const facts = (rows) => `<ul class="facts">${rows.map(([b, s]) => `<li><b>${b}</b><span>${s}</span></li>`).join("")}</ul>`;
const chapter = (c, extra = "") => `
<section id="${c.id}" data-for="${c.id}">
  ${mPanel(c.id)}
  <span class="label">chapter ${c.n}.</span>
  <h2 class="title display">${c.title}</h2>
  ${text(c)}
  ${c.pull ? `<p class="pull">${c.pull}</p>` : ""}
  ${extra}
</section>`;

document.getElementById("app").innerHTML = `
<section id="top" data-for="top">
  <h1 class="sr-only">nausher rao</h1>
  ${mPanel("top")}
  <span class="label">${S.dek}</span>
  <p class="headline">${S.headline[0]} <em>${S.headline[1]}</em></p>
  <p class="standfirst">${S.standfirst}</p>
  <ol class="contents">${S.chapters.map((c) => `<li><a href="#${c.id}"><span class="n">${c.n}.</span><em>${c.title}</em><span class="label">${c.big || ""}</span></a></li>`).join("")}</ol>
</section>
${chapter(ch("engineer"), `<div class="box"><span class="label">things i've built</span>${FX.built(window.PRODUCTS)}</div>`)}
${chapter(ch("founder"), `<div class="box"><span class="label">by the numbers</span>${facts(ch("founder").numbers)}</div>`)}
${chapter(ch("stage"), `
  <div class="box"><span class="label">spurhacks 2025, credits</span>${facts(spur.credits)}</div>
  <div class="box photos">${["spurhacks-6.jpg", ...C.events.filter((e) => e.id !== "spurhacks").map((e) => e.photos[0])].map((f, i) => `<figure><div class="reveal">${img(f)}</div><figcaption>${i === 0 ? "camera and stage crew, spurhacks 2025" : C.events.filter((e) => e.id !== "spurhacks")[i - 1].name}</figcaption></figure>`).join("")}</div>`)}
${chapter(ch("band"))}
<section id="hi" data-for="hi">
  ${mPanel("hi")}
  <span class="label">chapter v. / house lights up</span>
  <a class="mail display" href="mailto:${C.email}">${C.email}</a>
  <nav class="elsewhere" aria-label="Elsewhere"><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="${C.links.letterboxd}" target="_blank" rel="noopener">letterboxd</a></nav>
  <p class="fine">${C.education.degree}, ${C.education.school}. designed and built by nausher rao.</p>
</section>`;

// The poster on the left follows whichever section is in the middle of the screen.
(() => {
  const panels = [...document.querySelectorAll(".panel")];
  const show = (id) => panels.forEach((p) => p.classList.toggle("is-on", p.dataset.panel === id));
  show("top");
  const io = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) show(e.target.dataset.for); }), { rootMargin: "-45% 0px -54% 0px" });
  document.querySelectorAll("[data-for]").forEach((s) => io.observe(s));
})();
FX.spotlight(document.querySelector(".hero-panel"));
FX.onceInView(".reveal");
</script>
</body>
</html>
