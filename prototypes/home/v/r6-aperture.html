<style>
/* Aperture: each work opens through a widening circle as it scrolls into view. */
@supports (animation-timeline: view()) {
  .work .art { opacity: 1; transform: none; transition: none; animation: aperture linear both; animation-timeline: view(); animation-range: entry 5% cover 48%; }
  @keyframes aperture { from { clip-path: circle(3% at 50% 50%); filter: brightness(1.6); } 60% { filter: none; } to { clip-path: circle(72% at 50% 50%); } }
  .chapter-title { animation: title-in linear both; animation-timeline: view(); animation-range: entry 0% cover 35%; }
  @keyframes title-in { from { letter-spacing: 0.08em; opacity: 0.2; } }
}
</style>
</head>
