<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500&display=swap">
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
/* A theatre programme: centred, double rules, dot leaders, two-column acts. */
@font-face { font-family: "Antique Olive"; src: url("../assets/antique-olive-black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
:root {
  --paper: #f2f1ed; --ink: #151515; --red: #d2311f; --dim: #5e5e5e; --rule: rgba(21, 21, 21, 0.2);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(20px, 3vw, 40px);
  --serif: "EB Garamond", Georgia, serif; --mono: "Geist Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.display { font-family: "Antique Olive", "Arial Black", sans-serif; font-weight: 900; letter-spacing: -0.03em; }
.caps { font-variant-caps: all-small-caps; letter-spacing: 0.08em; }
.needed { display: inline-block; padding: 2px 8px; border: 1px dashed var(--dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.double { border: 0; border-top: 3px double var(--ink); margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 var(--pad); }

/* ---------- cover ---------- */
.cover { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; padding: 72px var(--pad) 28px; text-align: center; }
.cover-top { font-size: 18px; padding-bottom: 14px; border-bottom: 3px double var(--ink); }
.cover-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.cover h1 { margin: 0; font-size: min(15vw, 21vh); line-height: 0.82; }
.cover h1 span { color: var(--red); }
.cover .sub { margin: 0; font-size: clamp(22px, 2.2vw, 32px); font-style: italic; }
.cover figure { margin: 8px 0 0; padding: 6px; border: 1px solid var(--ink); background: #fff; width: min(900px, 100%); }
.cover figure img { width: 100%; aspect-ratio: 21 / 8; max-height: 30vh; object-fit: cover; }
.cover-foot { display: flex; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 3px double var(--ink); font-size: 16px; }

/* ---------- contents, cast, note ---------- */
.front { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 96px); padding: clamp(80px, 10vw, 128px) 0 clamp(56px, 7vw, 96px); }
.front h2, .box h2 { margin: 0 0 18px; text-align: center; font-size: 22px; font-weight: 500; }
.leaders { list-style: none; margin: 0; padding: 0; }
.leaders li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 20px; }
.leaders li i { flex: 1; border-bottom: 1.5px dotted var(--dim); transform: translateY(-5px); }
.leaders a { text-decoration: none; }
.leaders a:hover { color: var(--red); }
.leaders .who { font-style: italic; }
.note { max-width: 720px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 0; text-align: left; }
.note h2 { margin: 0 0 20px; text-align: center; font-size: 22px; font-weight: 500; }
.note p { margin: 0; font-size: clamp(21px, 1.8vw, 25px); line-height: 1.55; }
.note p:first-of-type::first-letter { float: left; margin: 7px 10px 0 0; font-family: "Antique Olive", sans-serif; font-size: 3.9em; line-height: 0.8; color: var(--red); }
.note .sig { margin-top: 18px; text-align: right; font-style: italic; font-size: 20px; }

/* ---------- acts ---------- */
.act { padding-top: clamp(96px, 11vw, 150px); scroll-margin-top: 20px; }
.act-head { text-align: center; margin-bottom: 40px; }
.act-head .caps { font-size: 20px; color: var(--red); }
.act-head h2 { margin: 6px 0 0; font-size: clamp(56px, 8.6vw, 140px); line-height: 0.86; }
.act-head .feat { margin: 14px 0 0; font-size: 19px; font-style: italic; color: var(--dim); }
.cols { columns: 2; column-gap: 56px; column-rule: 1px solid var(--rule); padding-top: 28px; border-top: 3px double var(--ink); }
.cols p { margin: 0 0 1em; font-size: 19.5px; line-height: 1.6; break-inside: avoid-column; }
.cols p:first-child::first-line { font-variant-caps: all-small-caps; letter-spacing: 0.06em; }
.pull { margin: 48px auto 0; max-width: 820px; text-align: center; font-size: clamp(30px, 3.4vw, 48px); line-height: 1.15; font-style: italic; }
.pull::before { content: "❧"; display: block; margin-bottom: 10px; color: var(--red); font-style: normal; font-size: 0.8em; }
.box { margin-top: 56px; }
.box h2 { font-size: 20px; }

.built { --b-strong: var(--ink); --b-rule: var(--rule); --b-accent: var(--red); --b-on-accent: #fff; --b-dim: var(--dim); --b-mono: var(--mono); }
.built-name { font-family: "Antique Olive", sans-serif; font-weight: 900; letter-spacing: -0.02em; }
.built-what { font-size: 17px !important; }
a.built-row:hover .built-name { color: var(--red); }

.boxoffice { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 3px double var(--ink); border-bottom: 3px double var(--ink); }
.boxoffice div { padding: 20px 16px; text-align: center; }
.boxoffice div + div { border-left: 1px solid var(--rule); }
.boxoffice b { display: block; font-family: "Antique Olive", sans-serif; font-size: clamp(20px, 2vw, 30px); line-height: 1.05; letter-spacing: -0.02em; }
.boxoffice span { font-size: 16px; font-style: italic; color: var(--dim); }

.intermission { margin-top: clamp(96px, 11vw, 150px); padding: clamp(48px, 6vw, 80px) var(--pad); background: var(--red); color: var(--paper); text-align: center; }
.intermission h2 { margin: 0; font-size: clamp(48px, 8vw, 128px); line-height: 0.9; }
.intermission p { margin: 14px 0 0; font-size: 20px; font-style: italic; }

.history { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.history a { text-decoration: none; }
.history figure { margin: 0; padding: 5px; border: 1px solid var(--ink); background: #fff; }
.history img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.history h3 { margin: 12px 0 0; font-size: 21px; font-weight: 600; line-height: 1.15; }
.history p { margin: 4px 0 0; font-size: 16px; font-style: italic; color: var(--dim); }
.history a:hover h3 { color: var(--red); }
.credits { max-width: 640px; margin: 0 auto; }
.reveal { clip-path: inset(0 0 100% 0); transition: clip-path 900ms var(--ease-out); }
.reveal.is-in { clip-path: inset(0 0 0 0); }

/* ---------- curtain call ---------- */
.curtain { margin-top: clamp(96px, 11vw, 150px); padding: clamp(80px, 10vw, 128px) var(--pad) 40px; text-align: center; border-top: 3px double var(--ink); }
.curtain .caps { font-size: 20px; color: var(--red); }
.curtain a.mail { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 16px; font-size: clamp(28px, 6vw, 92px); line-height: 0.95; text-decoration: none; }
.curtain a.mail:hover { color: var(--red); }
.curtain nav { display: flex; justify-content: center; gap: 24px; margin-top: 24px; font-size: 19px; }
.curtain nav a { text-decoration: none; font-style: italic; }
.curtain nav a:hover { color: var(--red); }
.fine { display: flex; justify-content: space-between; gap: 16px; margin-top: 72px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 15px; color: var(--dim); text-align: left; }

@media (max-width: 900px) {
  .front, .history, .boxoffice { grid-template-columns: minmax(0, 1fr); }
  .boxoffice div + div { border-left: 0; border-top: 1px solid var(--rule); }
  .cols { columns: 1; }
  .cover-foot, .fine { flex-direction: column; align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { clip-path: none; transition: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const C = window.CONTENT, S = window.STORY;
const ch = (id) => S.chapters.find((c) => c.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;
const spur = C.events.find((e) => e.id === "spurhacks");
const acts = S.chapters.filter((c) => c.id !== "hi");
const CAST = [["the engineer", "nausher rao"], ["the founder", "nausher rao"], ["the product owner", "nausher rao"], ["the stage manager", "nausher rao"], ["the bandmate", "nausher rao"], ["understudies", "none"]];
const FEATURING = {
  engineer: "featuring mappedin, shopify, webisoft, magnet forensics and tab",
  founder: "featuring konfer, spur innovation center, near, and something new",
  stage: "featuring spurhacks, hawkhacks, a yacht, and a bbq festival",
  band: "featuring the band",
};
const leaders = (rows) => `<ul class="leaders">${rows.map(([a, b]) => `<li>${a}<i></i><span class="who">${b}</span></li>`).join("")}</ul>`;
const act = (c, i, extra = "") => `
<section class="act wrap" id="${c.id}">
  <header class="act-head"><span class="caps">act ${c.n}</span><h2 class="display">${c.title}</h2><p class="feat">${FEATURING[c.id]}</p></header>
  <div class="cols">${c.paras.map((p) => `<p>${p}</p>`).join("")}${c.needed ? `<p><span class="needed">content needed</span></p>` : ""}</div>
  ${c.pull ? `<p class="pull">${c.pull}</p>` : ""}
  ${extra}
</section>`;
const history = C.events.map((e) => `
  <a href="${e.url}" target="_blank" rel="noopener">
    <figure class="reveal">${img(e.photos[0], e.name)}</figure>
    <h3>${e.name}</h3><p>${e.date}. ${e.stats[0][0]} ${e.stats[0][1]}.</p>
  </a>`).join("");

document.getElementById("app").innerHTML = `
<section class="cover">
  <div class="cover-top caps">nausher rao presents</div>
  <div class="cover-mid">
    <h1 class="display">nausher rao<span>.</span></h1>
    <p class="sub">${S.headline.join(" ")}</p>
    <p class="caps" style="margin:0;font-size:18px">a production in four acts and a curtain call</p>
    <figure>${img("spurhacks-2.jpg", "The audience at SpurHacks 2025")}</figure>
  </div>
  <div class="cover-foot caps"><span>${C.place}</span><span>the 2026 season</span><span>please silence your phones</span></div>
</section>

<div class="wrap">
  <hr class="double">
  <div class="front">
    <div><h2 class="caps">in this programme</h2>${leaders([...acts.map((c) => [`<a href="#${c.id}">act ${c.n}. ${c.title}</a>`, c.big]), [`<a href="#hi">curtain call</a>`, "say hi"]])}</div>
    <div><h2 class="caps">the cast</h2>${leaders(CAST)}</div>
  </div>
  <hr class="double">
  <div class="note"><h2 class="caps">a note from the director</h2><p>${S.standfirst}</p><p class="sig">n.r.</p></div>
</div>

${act(ch("engineer"), 0, `<div class="box"><h2 class="caps">things i've built</h2>${FX.built(window.PRODUCTS)}</div>`)}

${act(ch("founder"), 1, `<div class="box"><h2 class="caps">box office</h2><div class="boxoffice">${ch("founder").numbers.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div></div>`)}

<section class="intermission"><h2 class="display">intermission</h2><p>stretch your legs. the second half is mostly live.</p></section>

${act(ch("stage"), 2, `
  <div class="box"><h2 class="caps">production history</h2><div class="history">${history}</div></div>
  <div class="box credits"><h2 class="caps">spurhacks 2025, credits</h2>${leaders(spur.credits)}</div>`)}

${act(ch("band"), 3)}

<section class="curtain" id="hi">
  <span class="caps">curtain call</span><br>
  <a class="mail display" href="mailto:${C.email}">${C.email}</a>
  <nav aria-label="Elsewhere"><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="${C.links.letterboxd}" target="_blank" rel="noopener">letterboxd</a></nav>
  <div class="fine wrap"><span>${C.education.degree}, ${C.education.school}.</span><span>set in antique olive and eb garamond. designed and built by nausher rao.</span></div>
</section>`;

FX.onceInView(".reveal");
</script>
</body>
</html>
