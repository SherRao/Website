<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feature, printed</title>
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
/* A printed magazine in the International Typographic Style: Helvetica, a 12-column grid, orange + black on paper. */
:root {
  --paper: #f3f3f1; --ink: #111; --orange: #ff5b14; --rule: rgba(17, 17, 17, 0.16);
  --pad: clamp(18px, 2.2vw, 32px);
  --helv: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--helv); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.lower { text-transform: lowercase; }
.needed { display: inline-block; padding: 2px 7px; border: 1.5px dashed currentColor; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

/* ---------- posters ---------- */
.poster { position: relative; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding: var(--pad); overflow: hidden; }
.p-white { background: var(--paper); color: var(--ink); --accent: var(--orange); }
.p-orange { background: var(--orange); color: var(--ink); --accent: var(--ink); }
.p-black { background: var(--ink); color: var(--paper); --accent: var(--orange); }
@media (min-width: 1000px) and (min-height: 720px) { .poster { position: sticky; top: 0; height: 100dvh; } }
/* A transparent spacer after each sticky poster, so it holds full-screen before the next page slides over it. */
.hold { display: none; }
@media (min-width: 1000px) and (min-height: 720px) { .hold { display: block; height: 45dvh; } }

.meta, .foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--pad); font-size: 12px; line-height: 1.3; }
.meta { padding-bottom: 10px; border-bottom: 2px solid currentColor; }
.foot { padding-top: 12px; border-top: 2px solid currentColor; font-size: 13px; }
.meta b, .foot b { font-weight: 700; }
.foot b { display: block; font-size: 15px; }
.foot p { margin: 4px 0 0; opacity: 0.8; }
.meta a { text-decoration: none; }
.meta a:hover { text-decoration: underline; }
.p-body { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--pad); align-items: end; padding: clamp(16px, 3vh, 40px) 0; min-height: 0; }
.huge { margin: 0; font-weight: 700; line-height: 0.8; letter-spacing: -0.055em; }
.kicker { margin: 0 0 12px; font-size: 13px; font-weight: 700; }
.kicker span { color: var(--accent); }
.statement { margin: 0; font-size: clamp(26px, 2.6vw, 40px); font-weight: 700; line-height: 1.02; letter-spacing: -0.03em; }
.duo { background: var(--orange); overflow: hidden; }
.duo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15) brightness(1.05); mix-blend-mode: multiply; }

.cover .huge { grid-column: 1 / 9; font-size: min(17vw, 30vh); }
.cover .huge span { color: var(--orange); }
.cover .statement { grid-column: 9 / -1; }
.opener .huge { grid-column: 1 / 8; font-size: min(38vw, 58vh); }
.opener .huge.wide { font-size: min(21vw, 32vh); }
.opener .huge.mid { font-size: min(30vw, 46vh); color: var(--orange); }
.opener .side { grid-column: 8 / -1; }
.opener .shows { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--pad); }
.opener .shows .duo { height: min(26vh, 220px); }
.opener .shows b { display: block; margin-top: 8px; font-size: 14px; }
.opener .shows span { font-size: 12px; }
.hi .huge { grid-column: 1 / -1; font-size: min(24vw, 34vh); }
.hi .mail { grid-column: 1 / -1; font-size: clamp(28px, 4.4vw, 64px); font-weight: 700; letter-spacing: -0.04em; text-decoration: none; overflow-wrap: anywhere; }
.hi .mail:hover { color: var(--orange); }

/* ---------- article pages: paper that slides over the poster before it ---------- */
.page { position: relative; background: var(--paper); padding: clamp(72px, 9vw, 128px) var(--pad); box-shadow: 0 -24px 48px rgba(0, 0, 0, 0.16); }
.cols { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--pad); }
.cols > .side { grid-column: 1 / 4; font-size: 13px; line-height: 1.45; }
.cols > .body { grid-column: 4 / 11; }
.side h4 { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); font-size: 12px; font-weight: 700; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li { padding: 8px 0; border-bottom: 1px solid var(--rule); }
.side li b { display: block; font-weight: 700; }
.body p { margin: 0 0 1em; font-size: clamp(18px, 1.35vw, 21px); line-height: 1.5; letter-spacing: -0.005em; }
.standfirst { font-size: clamp(26px, 2.5vw, 40px) !important; font-weight: 700; line-height: 1.12 !important; letter-spacing: -0.025em !important; }
.pull { grid-column: 4 / -1; margin: 32px 0 0; padding-top: 16px; border-top: 2px solid var(--ink); font-size: clamp(34px, 4vw, 64px); font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
.pull::before { content: "“"; color: var(--orange); }
.contents { grid-column: 4 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--pad); margin-top: 40px; padding-top: 12px; border-top: 2px solid var(--ink); list-style: none; padding-left: 0; }
.contents a { display: block; text-decoration: none; font-size: 15px; font-weight: 700; }
.contents a span { display: block; font-weight: 400; color: var(--orange); }
.contents a:hover { text-decoration: underline; }
.spread { grid-column: 1 / -1; display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--pad); margin-top: 40px; }
.spread figure { margin: 0; }
.spread img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.spread figure:last-child img { aspect-ratio: auto; height: 100%; }
figcaption { margin-top: 6px; font-size: 12px; }
.built-wrap { grid-column: 1 / -1; margin-top: 56px; }
.built-wrap h4 { margin: 0 0 12px; font-size: 13px; font-weight: 700; }
.built { --b-strong: var(--ink); --b-rule: var(--rule); --b-accent: var(--orange); --b-on-accent: var(--ink); --b-dim: #555; --b-mono: var(--helv); }
.built-name { font-weight: 700; letter-spacing: -0.02em; }
.built-n { font-weight: 700; }
a.built-row:hover .built-name { color: var(--orange); }

@media (max-width: 999px) {
  .meta, .foot { grid-template-columns: repeat(2, 1fr); }
  .p-body > *, .cols > * { grid-column: 1 / -1 !important; }
  .opener .shows { grid-template-columns: repeat(2, 1fr); }
  .contents { grid-template-columns: repeat(2, 1fr); }
  .spread { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const C = window.CONTENT, S = window.STORY;
const ch = (id) => S.chapters.find((c) => c.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;
const pad2 = (n) => String(n).padStart(2, "0");
const meta = (n, title) => `
  <header class="meta">
    <span><b>nausher rao</b><br>portfolio, 2026</span>
    <span><b>${n}</b><br>${title}</span>
    <span>${C.place}<br>${C.now.role}, ${C.now.org}</span>
    <span><a href="mailto:${C.email}">${C.email}</a><br><a href="${C.links.github}" target="_blank" rel="noopener">github</a>, <a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a></span>
  </header>`;
const opener = (c, i, color, extra = "", size = "", foot = "") => `
<section class="poster ${color} opener" id="${c.id}">
  ${meta(`${c.n}.`, c.title)}
  <div class="p-body">
    <p class="huge ${size}">${c.big}</p>
    <div class="side"><p class="kicker">${c.n}. <span>/</span> ${c.title}</p><p class="statement">${c.bigCap}.</p></div>
    ${extra}
  </div>
  ${foot}
</section>
<div class="hold" aria-hidden="true"></div>`;
const page = (c, side, after = "") => `
<section class="page">
  <div class="cols">
    ${side}
    <div class="body lower">${c.paras.map((p) => `<p>${p}</p>`).join("")}${c.needed ? `<p><span class="needed">content needed</span></p>` : ""}</div>
    ${c.pull ? `<p class="pull lower">${c.pull}</p>` : ""}
    ${after}
  </div>
</section>`;
const side = (title, rows) => `<div class="side"><h4>${title}</h4><ul>${rows.map(([b, s]) => `<li><b>${b}</b>${s}</li>`).join("")}</ul></div>`;
const spur = C.events.find((e) => e.id === "spurhacks");
const roleFoot = `<footer class="foot">${C.roles.map((r, i) => `<div><b>${pad2(i + 1)} ${r.word}</b><p>${r.detail}${r.needed ? ` <span class="needed">content needed</span>` : ""}</p></div>`).join("")}</footer>`;

document.getElementById("app").innerHTML = `
<section class="poster p-white cover">
  ${meta("00", "an essay in five parts")}
  <div class="p-body">
    <h1 class="huge">nausher<br>rao<span>.</span></h1>
    <p class="statement">${S.headline.join(" ")}</p>
  </div>
  ${roleFoot}
</section>
<div class="hold" aria-hidden="true"></div>

<section class="page">
  <div class="cols">
    <div class="side"><h4>in this issue</h4><ul><li><b>5 chapters</b>about 4 minutes</li><li><b>set in</b>helvetica neue</li></ul></div>
    <div class="body lower"><p class="standfirst">${S.standfirst}</p></div>
    <ol class="contents">${S.chapters.map((c) => `<li><a href="#${c.id}"><span>${c.n}.</span>${c.title}</a></li>`).join("")}</ol>
  </div>
</section>

${opener(ch("engineer"), 0, "p-orange")}
${page(ch("engineer"), "", `<div class="built-wrap"><h4>things i've built</h4>${FX.built(window.PRODUCTS)}</div>`)}


${opener(ch("founder"), 1, "p-black", "", "wide")}
${page(ch("founder"), side("by the numbers", ch("founder").numbers))}

${opener(ch("stage"), 2, "p-white", `<div class="shows">${C.events.map((e) => `<a href="${e.url}" target="_blank" rel="noopener" style="text-decoration:none"><div class="duo">${img(e.photos[0], e.name)}</div><b>${e.name}</b><span>${e.date}</span></a>`).join("")}</div>`, "wide")}
${page(ch("stage"), side("spurhacks 2025, credits", spur.credits), `<div class="spread"><figure>${img("spurhacks-6.jpg", "Camera and stage crew at SpurHacks 2025")}<figcaption>camera and stage crew, spurhacks 2025</figcaption></figure><figure>${img("spurhacks-4.jpg", "Doors open at SpurHacks 2025")}<figcaption>doors open</figcaption></figure></div>`)}

${opener(ch("band"), 3, "p-black", "", "mid", `<footer class="foot"><div><b>band</b><p>name tba</p></div><div><b>instrument</b><p>tba</p></div><div><b>listen</b><p>tba</p></div><div><b>next show</b><p>tba</p></div></footer>`)}
${page(ch("band"), "")}

<section class="poster p-orange hi" id="hi">
  ${meta("v.", "say hi")}
  <div class="p-body">
    <p class="huge">say hi.</p>
    <a class="mail" href="mailto:${C.email}">${C.email}</a>
  </div>
  <footer class="foot"><div><b>github</b><p><a href="${C.links.github}" target="_blank" rel="noopener">SherRao</a></p></div><div><b>linkedin</b><p><a href="${C.links.linkedin}" target="_blank" rel="noopener">nausherrao</a></p></div><div><b>letterboxd</b><p><a href="${C.links.letterboxd}" target="_blank" rel="noopener">SherRao</a></p></div><div><b>school</b><p>${C.education.school}</p></div></footer>
</section>`;
</script>
</body>
</html>
