<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="../content.js"></script>
<style>
:root {
  --bg: #0e0f11; --tile: #16171a; --edge: #232428; --edge-hi: #3a3b40; --ink: #ececed; --ink2: #8c8e94; --live: #62d98b; --blue: #3b76ff;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(16px, 2.4vw, 32px);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; }
.label { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); }
.needed { display: inline-block; padding: 2px 7px; border: 1px dashed var(--edge-hi); font-family: "Geist Mono", monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(98, 217, 139, 0.15); }
.idle { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink2); }

.top { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 var(--pad); font-size: 13px; }
.top b { font-weight: 600; }
.top nav { display: flex; gap: 22px; }
.top nav a { color: var(--ink2); transition: color 150ms ease; }
.top nav a:hover { color: var(--ink); }

/* ---------- the board ---------- */
.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(150px, auto); gap: 12px; padding: 8px var(--pad) 12px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 20px; border: 1px solid var(--edge); border-radius: 14px; background: var(--tile); transition: border-color 150ms ease; animation: tile-in 500ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
a.tile:hover { border-color: var(--edge-hi); }
@keyframes tile-in { from { opacity: 0; transform: translateY(8px); } }
.tile .label { margin: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w6 { grid-column: span 6; } .h2 { grid-row: span 2; }

.intro h1 { margin: 0; font-size: clamp(48px, 5.6vw, 88px); font-weight: 600; line-height: 0.9; letter-spacing: -0.045em; }
.intro p { margin: 16px 0 0; max-width: 46ch; font-size: 16px; line-height: 1.55; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.chips span { padding: 5px 10px; border: 1px solid var(--edge-hi); border-radius: 999px; font-size: 13px; }

.now { background-color: #121418; background-image: linear-gradient(#1b1d22 1px, transparent 1px), linear-gradient(90deg, #1b1d22 1px, transparent 1px); background-size: 28px 28px; }
.now-dot { position: absolute; left: 58%; top: 40%; width: 0; height: 0; }
.now-dot i { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(59, 118, 255, 0.14); box-shadow: inset 0 0 0 1px rgba(59, 118, 255, 0.35); animation: breathe 2800ms ease-in-out infinite; }
.now-dot b { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px #fff; }
@keyframes breathe { 50% { transform: scale(1.18); } }
.big { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.sub { margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink2); }

.clock { font-size: 44px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }

.photo { padding: 0; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease-out); }
a.photo:hover img { transform: scale(1.02); }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.78), transparent 55%); }
.photo-cap { position: relative; z-index: 1; margin-top: auto; padding: 20px; }
.photo-cap h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
.photo-cap p { margin: 6px 0 0; font-size: 14px; color: rgba(255, 255, 255, 0.75); }

.stats { list-style: none; margin: 0; padding: 0; }
.stats li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--edge); }
.stats li:last-child { border-bottom: 0; }
.stats b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--ink2); text-align: right; }

.films { list-style: none; margin: 0; padding: 0; }
.films li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--edge); }
.films li:last-child { border-bottom: 0; }
.films b { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.films .stars { font-size: 12px; color: var(--live); letter-spacing: 1px; }
.films small { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); }

.arrow { position: absolute; right: 18px; top: 18px; color: var(--ink2); transition: transform 150ms var(--ease-out), color 150ms ease; }
a.tile:hover .arrow { color: var(--ink); transform: translate(2px, -2px); }

/* ---------- below the board ---------- */
section { padding: clamp(80px, 9vw, 128px) var(--pad) 0; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; }
.sec-head h2 { margin: 0; font-size: clamp(32px, 3.4vw, 52px); font-weight: 600; letter-spacing: -0.04em; }
.jobs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.job { padding: 22px; border: 1px solid var(--edge); border-radius: 14px; background: var(--tile); }
.job-top { display: flex; justify-content: space-between; gap: 12px; }
.job h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.job .when { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.job .role { margin: 4px 0 0; font-size: 14.5px; color: var(--ink2); }
.job ul { margin: 14px 0 0; padding-left: 18px; font-size: 14.5px; line-height: 1.55; }
.events { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.event { overflow: hidden; border: 1px solid var(--edge); border-radius: 14px; background: var(--tile); transition: border-color 150ms ease; }
.event:hover { border-color: var(--edge-hi); }
.event img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.event div { padding: 16px 18px 18px; }
.event h3 { margin: 0; font-size: 17px; font-weight: 600; }
.event p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }
.foot { display: flex; justify-content: space-between; margin-top: clamp(80px, 9vw, 128px); padding: 24px var(--pad); border-top: 1px solid var(--edge); font-size: 12px; color: var(--ink2); }

@media (max-width: 1100px) {
  .w3 { grid-column: span 6; } .w4 { grid-column: span 6; } .w6 { grid-column: span 12; }
  .events { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
  .top nav { display: none; }
  .w3, .w4, .w6 { grid-column: span 12; } .h2 { grid-row: span 1; }
  .photo { min-height: 280px; }
  .jobs, .events { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .tile { animation: none; }
  .now-dot i { animation: none; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header class="top"><b>nausher rao</b><nav aria-label="Contact"></nav></header>
<main id="app"></main>

<script>
const C = window.CONTENT;
const ev = (id) => C.events.find((e) => e.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}" loading="lazy">`;
const spur = ev("spurhacks");
const konfer = C.experience.find((x) => x.org === "konfer");
document.querySelector(".top nav").innerHTML = `<a href="#work">work</a><a href="#events">events</a><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a>`;
let i = 0;
const n = () => `style="--i:${i++}"`;

document.getElementById("app").innerHTML = `
<div class="board">
  <div class="tile intro w6 h2" ${n()}>
    <p class="label">hello</p>
    <h1>nausher rao</h1>
    <p>${C.intro}</p>
    <div class="chips">${C.roles.map((r) => `<span>${r.word}</span>`).join("")}</div>
  </div>

  <a class="tile now w3 h2" href="${C.now.url}" target="_blank" rel="noopener" ${n()}>
    <p class="label"><span class="live"></span>now</p>
    <span class="now-dot" aria-hidden="true"><i></i><b></b></span>
    <p class="big">${C.now.org}</p>
    <p class="sub">${C.now.role}. i work on the blue dot: the part of an indoor map that knows where you are.</p>
    <span class="arrow">↗</span>
  </a>

  <div class="tile w3" ${n()}>
    <p class="label"><span class="live"></span>${C.place}</p>
    <span class="clock" data-clock>--:--</span>
    <p class="sub" data-clock-sub>local time</p>
  </div>

  <div class="tile w3" ${n()}>
    <p class="label"><span class="idle"></span>on spotify</p>
    <p class="big" style="font-size:22px">not listening right now</p>
    <p class="sub">shows the live track once it's hooked up to the v4 spotify endpoint.</p>
  </div>

  <a class="tile photo w6 h2" href="${spur.url}" target="_blank" rel="noopener" ${n()}>
    ${img(spur.photos[0], "SpurHacks 2025 audience")}
    <div class="photo-cap"><h2>${spur.name}</h2><p>director, stage &amp; production manager, product owner / ${spur.date}</p></div>
  </a>

  <div class="tile w3 h2" ${n()}>
    <p class="label">by the numbers</p>
    <ul class="stats">
      <li><b>1,400+</b><span>people at spurhacks</span></li>
      <li><b>291</b><span>projects shipped there</span></li>
      <li><b>$1M+</b><span>startup funding managed</span></li>
      <li><b>1.1M+</b><span>daily users, shopify partner dashboard</span></li>
    </ul>
  </div>

  <a class="tile w3 h2" href="${C.links.letterboxd}" target="_blank" rel="noopener" ${n()}>
    <p class="label"><span class="live"></span>last watched</p>
    <ul class="films">${C.films.map((f) => `<li><b>${f.title}</b><span class="stars">${stars(f.rating)}</span><small>${f.year} / watched ${f.watched}</small></li>`).join("")}</ul>
    <span class="arrow">↗</span>
  </a>

  <a class="tile w4" href="${konfer.url}" target="_blank" rel="noopener" ${n()}>
    <p class="label">company</p>
    <p class="big" style="font-size:24px">konfer</p>
    <p class="sub">${konfer.role}, ${konfer.when}. we produced spurhacks and built its event platform.</p>
    <span class="arrow">↗</span>
  </a>

  <div class="tile w4" ${n()}>
    <p class="label">the band</p>
    <p class="sub" style="margin-top:0">${C.band.line}</p>
    <p style="margin:12px 0 0"><span class="needed">content needed</span></p>
  </div>

  <a class="tile w4" href="mailto:${C.email}" ${n()}>
    <p class="label">say hi</p>
    <p class="big" style="font-size:24px">${C.email}</p>
    <span class="arrow">↗</span>
  </a>
</div>

<section id="work">
  <div class="sec-head"><h2>work</h2><span class="label">2021 to now</span></div>
  <div class="jobs">
    ${C.experience.map((x) => `
    <article class="job">
      <div class="job-top"><h3>${x.org}</h3><span class="when">${x.when}</span></div>
      <p class="role">${x.role}${x.place ? `, ${x.place}` : ""}</p>
      <ul>${x.points.map((p) => `<li>${p}</li>`).join("")}</ul>
    </article>`).join("")}
  </div>
</section>

<section id="events">
  <div class="sec-head"><h2>events</h2><span class="label">av + stage management</span></div>
  <div class="events">
    ${C.events.map((e) => `
    <a class="event" href="${e.url}" target="_blank" rel="noopener">
      ${img(e.photos[0], e.name)}
      <div><h3>${e.name}</h3><p>${e.date}<br>${e.stats.slice(0, 2).map(([b, s]) => `${b} ${s}`).join(" / ")}</p></div>
    </a>`).join("")}
  </div>
</section>
<footer class="foot"><span>${C.education.degree}, ${C.education.school}</span><span>designed and built by nausher rao</span></footer>`;

// ---- live local time in waterloo ----
(() => {
  const clock = document.querySelector("[data-clock]"), sub = document.querySelector("[data-clock-sub]");
  const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: C.timezone, hour: "numeric", minute: "2-digit", hour12: true });
  const hourFmt = new Intl.DateTimeFormat("en-CA", { timeZone: C.timezone, hour: "numeric", hour12: false });
  function tick() {
    const now = new Date();
    clock.textContent = fmt.format(now).replace(/\s?[ap]\.?m\.?/i, "");
    const h = +hourFmt.format(now) % 24;
    const part = h < 5 ? "night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
    sub.textContent = `${/p\.?m/i.test(fmt.format(now)) ? "pm" : "am"}, ${part} in waterloo`;
  }
  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>
