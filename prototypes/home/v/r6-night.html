<style>
/* Night Gallery: each work sits dark until it reaches you, then gets its own pool of light. */
.work .art::before { content: ""; position: absolute; inset: -14% 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1600ms var(--ease-out);
  background: radial-gradient(closest-side at 50% 45%, rgba(255, 230, 196, 0.14), rgba(255, 230, 196, 0.04) 60%, transparent 75%); }
.work .art > * { filter: brightness(0.3) saturate(0.6); transition: filter 1600ms var(--ease-out); }
.work.is-in .art::before { opacity: 1; }
.work.is-in .art > * { filter: none; }
.work .art { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .work .art > * { filter: none; } .work .art::before { opacity: 1; } }
</style>
</head>
