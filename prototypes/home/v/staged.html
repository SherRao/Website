<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Feature, staged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
@font-face { font-family: "Antique Olive"; src: url("../assets/antique-olive-black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
:root {
  --bg: #0c0b0d; --ink: #efe7dc; --dim: rgba(239, 231, 220, 0.6); --faint: rgba(239, 231, 220, 0.24); --line: rgba(239, 231, 220, 0.1);
  --gel: #ffe6c4; --unlit: #36313b;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(20px, 3vw, 40px);
  --serif: "EB Garamond", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.display { font-family: "Antique Olive", "Arial Black", sans-serif; font-weight: 900; letter-spacing: -0.03em; }
.label { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.needed { display: inline-block; padding: 2px 8px; border: 1px dashed var(--faint); font-family: "Geist Mono", monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

.nav { position: fixed; inset: 0 0 auto; z-index: 20; display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 var(--pad); font-family: Geist, sans-serif; font-size: 13px; background: linear-gradient(to bottom, rgba(12, 11, 13, 0.9), rgba(12, 11, 13, 0)); }
.nav a { text-decoration: none; }
.nav nav { display: flex; gap: 18px; }
.nav nav a { color: var(--dim); font-family: var(--serif); font-size: 16px; font-style: italic; transition: color 150ms ease; }
.nav nav a:hover { color: var(--ink); }

/* ---------- cover: followspot on the name ---------- */
.hero { position: relative; min-height: 100dvh; overflow: hidden; display: grid; grid-template-rows: 1fr auto; padding: 96px var(--pad) 48px; }
.name { margin: 0; font-size: clamp(76px, 13vw, 232px); line-height: 0.8; display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; }
.name span { display: block; }
.name--base { align-self: center; position: relative; z-index: 1; color: var(--unlit); user-select: none; }
.hero.is-rm .name--base { color: var(--gel); }
.name--lit { color: var(--gel); }
.hero-foot { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.headline { margin: 0; font-size: clamp(30px, 3.4vw, 54px); font-weight: 400; line-height: 1.02; }
.headline em { color: var(--gel); }
.dek { margin: 12px 0 0; }

/* ---------- body ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--pad); }
.standfirst { max-width: 680px; margin: clamp(80px, 10vw, 140px) auto 0; font-size: clamp(22px, 1.9vw, 27px); line-height: 1.5; }
.standfirst::first-letter { float: left; margin: 8px 12px 0 0; font-family: "Antique Olive", sans-serif; font-weight: 900; font-size: 4.2em; line-height: 0.8; color: var(--gel); }
.contents { max-width: 680px; margin: 56px auto 0; list-style: none; padding: 0; border-top: 1px solid var(--line); }
.contents a { display: grid; grid-template-columns: 48px 40px 1fr auto; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 20px; }
.contents a .n { font-style: italic; color: var(--dim); }
.contents a em { transition: color 150ms ease; }
.contents a:hover em { color: var(--gel); }

.chapter { padding-top: clamp(104px, 12vw, 176px); scroll-margin-top: 40px; }
.chapter-head { max-width: 1120px; margin: 0 auto 40px; padding: 0 var(--pad); display: grid; grid-template-columns: 1fr; justify-items: center; text-align: center; }
.chapter-head .label { transition: color 500ms var(--ease-out); }
.chapter-title { margin: 12px 0 0; font-size: clamp(56px, 9vw, 150px); line-height: 0.86; color: var(--unlit); transition: color 600ms var(--ease-out); }
.chapter-head.is-on .chapter-title { color: var(--gel); }
.chapter-head.is-on .label { color: var(--gel); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 660px) minmax(0, 1fr); column-gap: 48px; }
.grid > .text { grid-column: 2; }
.grid > aside { grid-column: 3; align-self: start; position: sticky; top: 88px; font-family: Geist, sans-serif; font-size: 13.5px; line-height: 1.5; padding-top: 8px; }
.text p { margin: 0 0 1.1em; font-size: 21px; line-height: 1.62; color: rgba(239, 231, 220, 0.86); }
aside h4 { margin: 0 0 10px; font-family: "Geist Mono", monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
aside ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--faint); }
aside li { padding: 9px 0; border-bottom: 1px solid var(--line); }
aside li b { font-weight: 500; }
aside li span { display: block; color: var(--dim); }
.pull { max-width: 960px; margin: 56px auto; padding: 0 var(--pad); text-align: center; font-size: clamp(34px, 3.8vw, 58px); line-height: 1.12; font-style: italic; color: var(--gel); }

.built-wrap { margin-top: 72px; }
.built-wrap > .label { margin: 0 0 14px; }
.built { --b-strong: var(--faint); --b-rule: var(--line); --b-accent: var(--gel); --b-on-accent: var(--bg); --b-dim: var(--dim); --b-mono: "Geist Mono", monospace; font-family: Geist, sans-serif; }
.built-name { font-family: "Antique Olive", sans-serif; font-weight: 900; letter-spacing: -0.02em; }
a.built-row:hover .built-name { color: var(--gel); }
.reveal { clip-path: inset(0 0 100% 0); transition: clip-path 1000ms var(--ease-out); }
.reveal.is-in { clip-path: inset(0 0 0 0); }
.full { margin: 56px 0 10px; }
.full img { width: 100%; max-height: 86vh; object-fit: cover; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 var(--pad); }
.strip figure { margin: 0; }
.strip img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
figcaption { margin-top: 8px; font-family: "Geist Mono", monospace; font-size: 11px; color: var(--dim); }

.door { margin-top: clamp(104px, 12vw, 176px); padding: clamp(96px, 12vw, 160px) var(--pad) 72px; text-align: center; background: radial-gradient(110% 90% at 50% 100%, #3a2d22 0%, #1c1612 55%, var(--bg) 100%); }
.door .numeral { display: block; font-size: 30px; font-style: italic; color: var(--dim); }
.door-mail { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 18px; font-size: clamp(28px, 6vw, 96px); line-height: 0.95; text-decoration: none; color: var(--gel); }
.door-mail:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 8px; }
.door nav { display: flex; justify-content: center; gap: 24px; margin-top: 28px; font-family: Geist, sans-serif; font-size: 14px; }
.door nav a { color: var(--dim); text-decoration: none; }
.door nav a:hover { color: var(--ink); }
.foot { display: flex; justify-content: space-between; gap: 16px; padding: 22px var(--pad); background: #1c1612; font-family: Geist, sans-serif; font-size: 12px; color: var(--dim); }

@media (max-width: 1000px) {
  .nav nav { display: none; }
  .hero { --spot-r: 170px; }
  .hero-foot { flex-direction: column; align-items: flex-start; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > .text, .grid > aside { grid-column: 1; position: static; }
  .grid > aside { margin-top: 8px; }
  .strip { grid-template-columns: minmax(0, 1fr); }
  .contents a { grid-template-columns: 40px 32px 1fr; }
  .contents a .label:last-child { display: none; }
  .text p { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
  .reveal { clip-path: none; }
}
</style>
</head>
<body>
<header class="nav"><a href="#top">nausher rao</a><nav aria-label="Chapters"></nav></header>
<main id="app"></main>
<script>
const C = window.CONTENT, S = window.STORY;
const ch = (id) => S.chapters.find((c) => c.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;
const spur = C.events.find((e) => e.id === "spurhacks");
const others = C.events.filter((e) => e.id !== "spurhacks");
const cue = (i) => `q${i + 1}`;
document.querySelector(".nav nav").innerHTML = S.chapters.map((c) => `<a href="#${c.id}">${c.n}.</a>`).join("");

const head = (c, i) => `<header class="chapter-head"><span class="label">${cue(i)} / ${c.n}.</span><h2 class="chapter-title display">${c.title}</h2></header>`;
const text = (c) => `<div class="text">${c.paras.map((p) => `<p>${p}</p>`).join("")}${c.needed ? `<p><span class="needed">content needed</span></p>` : ""}</div>`;
const list = (title, rows) => `<aside><h4>${title}</h4><ul>${rows.map(([b, s]) => `<li><b>${b}</b><span>${s}</span></li>`).join("")}</ul></aside>`;
const name = `<span>nausher</span><span>rao</span>`;

document.getElementById("app").innerHTML = `
<section class="hero" id="top">
  <div class="spot" aria-hidden="true"></div>
  <p class="name name--lit display" aria-hidden="true">${name}</p>
  <h1 class="name name--base display">${name}</h1>
  <div class="hero-foot">
    <div><p class="headline">${S.headline[0]} <em>${S.headline[1]}</em></p><p class="dek label">${S.dek}</p></div>
    <span class="label">scroll to begin</span>
  </div>
</section>

<div class="wrap">
  <p class="standfirst">${S.standfirst}</p>
  <ol class="contents">${S.chapters.map((c, i) => `<li><a href="#${c.id}"><span class="label">${cue(i)}</span><span class="n">${c.n}.</span><em>${c.title}</em><span class="label">${c.big || ""}</span></a></li>`).join("")}</ol>
</div>

<section class="chapter" id="engineer">
  ${head(ch("engineer"), 0)}
  <div class="grid wrap">${text(ch("engineer"))}</div>
  <p class="pull">${ch("engineer").pull}</p>
  <div class="wrap built-wrap"><p class="label">things i've built</p>${FX.built(window.PRODUCTS)}</div>
</section>

<section class="chapter" id="founder">
  ${head(ch("founder"), 1)}
  <div class="grid wrap">${text(ch("founder"))}${list("by the numbers", ch("founder").numbers)}</div>
  <p class="pull">${ch("founder").pull}</p>
</section>

<section class="chapter" id="stage">
  ${head(ch("stage"), 2)}
  <div class="grid wrap">${text(ch("stage"))}${list("spurhacks 2025, credits", spur.credits)}</div>
  <figure class="full"><div class="reveal">${img("spurhacks-6.jpg", "Camera and stage crew at SpurHacks 2025")}</div><figcaption style="padding:0 var(--pad)">camera and stage crew, spurhacks 2025</figcaption></figure>
  <p class="pull">${ch("stage").pull}</p>
  <div class="strip">${others.map((e) => `<figure><div class="reveal">${img(e.photos[0], e.name)}</div><figcaption>${e.name}, ${e.date}</figcaption></figure>`).join("")}</div>
</section>

<section class="chapter" id="band">
  ${head(ch("band"), 3)}
  <div class="grid wrap">${text(ch("band"))}</div>
</section>

<section class="door" id="hi">
  <span class="numeral">v. say hi, and the house lights come up</span>
  <a class="door-mail display" href="mailto:${C.email}">${C.email}</a>
  <nav aria-label="Elsewhere"><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="${C.links.letterboxd}" target="_blank" rel="noopener">letterboxd</a></nav>
</section>
<footer class="foot"><span>${C.education.degree}, ${C.education.school}</span><span>designed and built by nausher rao</span></footer>`;

FX.spotlight(document.querySelector(".hero"));
FX.cues(".chapter-head");
FX.onceInView(".reveal");
</script>
</body>
</html>
