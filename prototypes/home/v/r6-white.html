<style>
/* White Cube: Staged's structure in a daylight gallery. The cover spotlight now works in ink on white. */
:root { --bg: #fbfbfa; --ink: #141414; --dim: #767676; --faint: rgba(20, 20, 20, 0.22); --line: #e4e4e2; --gel: #141414; --unlit: #e2e2de; --piece: #fff; --accent: #1f5eff; --sans: "Hanken Grotesk", ui-sans-serif, sans-serif; }
.spot { background: radial-gradient(closest-side, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.015) 65%, transparent) !important; }
.standfirst::first-letter { color: var(--accent); }
.pull { color: var(--ink); }
.chapter-head.is-on .label-s { color: var(--accent); }
.art > img, .piece { box-shadow: 0 30px 60px -34px rgba(0, 0, 0, 0.28); }
.piece--type { color: #c9c9c6; }
.dots-cap { color: var(--ink); }
.door { background: #efefed; }
.door-mail { color: var(--ink); }
.foot { background: #efefed; }
@supports (animation-timeline: view()) {
  .work .art { opacity: 1; transform: none; transition: none; animation: rise linear both; animation-timeline: view(); animation-range: entry 0% cover 42%; }
  @keyframes rise { from { opacity: 0; transform: translateY(80px) scale(0.92); } }
}
</style>
</head>
<body data-fx="rise">

<main id="app"></main>
