<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
/* A hardware field manual: grey paper, numbered sections, a product diagram with callouts, one orange. */
:root {
  --bg: #e5e5e2; --paper: #efefec; --ink: #111; --mute: #666; --line: #c6c6c1; --orange: #ff4f00;
  --k1: #2f6bff; --k2: #1fb46a; --k3: #fafafa; --k4: #ff4f00;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(20px, 3vw, 40px);
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Archivo, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.mono { font-family: var(--mono); }
.tiny { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.needed { display: inline-block; padding: 2px 7px; border: 1px dashed var(--mute); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; color: var(--mute); }

.page { max-width: 1240px; margin: 0 auto; padding: 0 var(--pad); }
.sheet { padding: 28px 0 clamp(72px, 9vw, 120px); border-top: 1px solid var(--ink); scroll-margin-top: 0; }
.sheet-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: clamp(32px, 5vw, 64px); color: var(--mute); }
.sec { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px; align-items: baseline; }
.sec-n { font-family: var(--mono); font-size: 14px; color: var(--orange); }
.sec h2 { margin: 0; font-size: clamp(34px, 4vw, 60px); font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
.body { grid-column: 2; }
.lede { max-width: 62ch; margin: 18px 0 0; font-size: 18px; line-height: 1.55; }
.body p { max-width: 62ch; margin: 14px 0 0; font-size: 16.5px; line-height: 1.6; }

/* ---------- cover ---------- */
.cover { min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; padding: 72px 0 28px; }
.cover-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.model { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.model h1 { margin: 0; font-size: clamp(110px, 17vw, 270px); font-weight: 800; line-height: 0.8; letter-spacing: -0.06em; }
.model h1 span { color: var(--orange); }
.model p { margin: 0 0 12px; max-width: 26ch; font-size: 20px; line-height: 1.3; font-weight: 500; text-align: right; }
.diagram { align-self: center; }
.diagram svg { display: block; width: 100%; height: auto; max-height: 52vh; overflow: visible; font-family: Archivo, sans-serif; }
.cover-foot { display: flex; justify-content: space-between; gap: 16px; padding-top: 10px; border-top: 1px solid var(--ink); color: var(--mute); }

/* diagram parts */
.d-body { fill: #d4d4cf; stroke: var(--ink); stroke-width: 2; }
.d-screen { fill: #141414; }
.d-screen-text { fill: var(--orange); font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; }
.d-key { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.d-grille { fill: var(--ink); }
.d-lead { stroke: var(--ink); stroke-width: 1; fill: none; }
.d-num { font-family: var(--mono); font-size: 12px; fill: var(--orange); }
.d-label { font-size: 15px; font-weight: 600; fill: var(--ink); }
.d-sub { font-size: 12px; fill: var(--mute); }
.knob { cursor: pointer; }
.knob .dial { transform-box: fill-box; transform-origin: center; transition: transform 260ms var(--ease-out); }
.knob:hover .dial, .knob:focus-visible .dial, .knob.is-on .dial { transform: rotate(75deg); }
.knob circle { stroke: var(--ink); stroke-width: 2; }
.knob:focus-visible { outline: none; }
.knob:focus-visible circle { stroke: var(--orange); stroke-width: 3; }
.knob:hover .d-label, .knob:focus-visible .d-label { fill: var(--orange); }

/* ---------- specs ---------- */
.specs { max-width: 760px; margin: 28px 0 0; border-top: 2px solid var(--ink); }
.specs div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.specs dt { font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--mute); padding-top: 2px; }
.specs dd { margin: 0; }

/* ---------- modes ---------- */
.mode { display: grid; grid-template-columns: 120px minmax(0, 1fr) 220px; gap: 24px; padding: 40px 0; border-top: 1px dashed var(--line); scroll-margin-top: 24px; }
.mode:first-of-type { border-top: 0; }
.mode-n { font-family: var(--mono); font-size: 14px; color: var(--orange); }
.mode h3 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.mode .how { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; color: var(--mute); text-transform: uppercase; }
.mode-knob { justify-self: end; text-align: center; }
.mode-knob svg { width: 120px; height: 120px; }
.mode-knob figcaption { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--mute); }
.box { margin-top: 24px; }
.box > .tiny { display: block; margin-bottom: 10px; color: var(--mute); }
.built { --b-strong: var(--ink); --b-rule: var(--line); --b-accent: var(--orange); --b-on-accent: #fff; --b-dim: var(--mute); --b-mono: var(--mono); }
.built-name { font-weight: 700; letter-spacing: -0.01em; font-size: 19px !important; }
a.built-row:hover .built-name { color: var(--orange); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.readout div { padding: 14px 12px 14px 0; }
.readout div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.readout b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.readout span { font-family: var(--mono); font-size: 11px; color: var(--mute); text-transform: uppercase; }

/* ---------- field reports ---------- */
.reports { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 28px; }
.reports a { text-decoration: none; }
.reports figure { margin: 0; }
.reports img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; filter: grayscale(1) contrast(1.05); transition: filter 250ms ease; }
.reports a:hover img { filter: none; }
.reports figcaption { margin-top: 10px; font-size: 14px; line-height: 1.4; }
.reports figcaption b { display: block; font-size: 16px; }
.reports .tiny { display: block; margin-bottom: 4px; color: var(--orange); }

/* ---------- troubleshooting ---------- */
.trouble { width: 100%; max-width: 900px; margin-top: 28px; border-collapse: collapse; font-size: 15.5px; }
.trouble th { padding: 8px 12px 8px 0; border-bottom: 2px solid var(--ink); text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--mute); }
.trouble td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
.trouble td:first-child { width: 42%; font-weight: 600; }

.support-mail { display: inline-block; margin-top: 20px; font-size: clamp(28px, 4.4vw, 64px); font-weight: 800; letter-spacing: -0.03em; text-decoration: none; overflow-wrap: anywhere; }
.support-mail:hover { color: var(--orange); }
.support-links { display: flex; gap: 22px; margin-top: 16px; font-family: var(--mono); font-size: 13px; }
.support-links a { text-decoration: none; }
.support-links a:hover { color: var(--orange); }
.colophon { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0 28px; border-top: 1px solid var(--ink); color: var(--mute); }

@media (max-width: 900px) {
  .cover-meta { grid-template-columns: repeat(2, 1fr); }
  .model { flex-direction: column; align-items: flex-start; }
  .model p { text-align: left; }
  .sec, .mode { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .body { grid-column: 1; }
  .mode-knob { justify-self: start; }
  .reports { grid-template-columns: repeat(2, 1fr); }
  .specs div { grid-template-columns: 130px minmax(0, 1fr); }
  .cover-foot, .colophon, .sheet-head { flex-direction: column; gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .knob .dial, .reports img { transition: none; }
}
</style>
</head>
<body>
<main class="page" id="app"></main>
<script>
const C = window.CONTENT, S = window.STORY;
const ch = (id) => S.chapters.find((c) => c.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;
const MODES = [
  { id: "engineer", n: "01", name: "engineer", color: "var(--k1)", angle: -60, how: "turn knob 01" },
  { id: "founder", n: "02", name: "founder", color: "var(--k2)", angle: -20, how: "turn knob 02" },
  { id: "stage", n: "03", name: "stage manager", color: "var(--k3)", angle: 20, how: "turn knob 03" },
  { id: "band", n: "04", name: "bandmate", color: "var(--k4)", angle: 60, how: "turn knob 04" },
];
const SCREEN = { idle: ["NOW RUNNING", "MAPPEDIN"], engineer: ["MODE 01", "ENGINEER"], founder: ["MODE 02", "FOUNDER"], stage: ["MODE 03", "STAGE MGR"], band: ["MODE 04", "BANDMATE"] };
let pageNo = 0;
const head = (sec, title) => `<div class="sheet-head tiny"><span>nr-26 field manual</span><span>${sec} / ${title}</span><span>page ${String(++pageNo).padStart(2, "0")}</span></div>`;

// Product diagram: a small synth-like unit with four coloured knobs, a screen, keys and a speaker.
const knobX = [430, 510, 590, 670];
const diagram = `
<svg viewBox="0 0 900 440" role="img" aria-label="Diagram of the NR-26 with numbered parts">
  <rect class="d-body" x="150" y="100" width="600" height="240" rx="18"/>
  <rect class="d-screen" x="180" y="128" width="200" height="104" rx="8"/>
  <circle cx="352" cy="152" r="9" fill="rgba(47,107,255,0.25)"/><circle cx="352" cy="152" r="4" fill="#2f6bff"/>
  <text class="d-screen-text" x="196" y="178" data-screen1>${SCREEN.idle[0]}</text>
  <text class="d-screen-text" x="196" y="206" style="font-size:20px;font-weight:500" data-screen2>${SCREEN.idle[1]}</text>
  ${[...Array(15)].map((_, i) => `<rect class="d-key" x="${180 + i * 37.4}" y="262" width="31" height="56" rx="4"/>`).join("")}
  ${[...Array(24)].map((_, i) => `<circle class="d-grille" cx="${712 + (i % 3) * 12}" cy="${134 + Math.floor(i / 3) * 12}" r="2.4"/>`).join("")}
  ${MODES.map((m, i) => `
  <a class="knob" href="#mode-${m.id}" data-mode="${m.id}" aria-label="Mode ${m.n}: ${m.name}">
    <g class="dial"><circle cx="${knobX[i]}" cy="180" r="28" fill="${m.color}"/><line x1="${knobX[i]}" y1="180" x2="${knobX[i]}" y2="158" stroke="#111" stroke-width="3" stroke-linecap="round"/></g>
    <path class="d-lead" d="M${knobX[i]} 150 V${i % 2 ? 58 : 34}"/>
    <text class="d-num" x="${knobX[i] - 14}" y="${i % 2 ? 50 : 26}">${m.n}</text>
    <text class="d-label" x="${knobX[i] + 6}" y="${i % 2 ? 50 : 26}">${m.name}</text>
  </a>`).join("")}
  <path class="d-lead" d="M180 180 H70"/><text class="d-num" x="20" y="176">05</text><text class="d-label" x="20" y="198">display</text><text class="d-sub" x="20" y="216">shows the current job</text>
  <path class="d-lead" d="M460 318 V390"/><text class="d-num" x="438" y="410">06</text><text class="d-label" x="466" y="410">keys</text><text class="d-sub" x="466" y="428">7 products, see 2.1</text>
  <path class="d-lead" d="M750 170 H800"/><text class="d-num" x="808" y="160">07</text><text class="d-label" x="808" y="178">speaker</text><text class="d-sub" x="808" y="196">live events, see 3.0</text>
</svg>`;

const knobIcon = (m) => `
<figure class="mode-knob" aria-hidden="true">
  <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#c6c6c1" stroke-dasharray="2 6"/>
    <g transform="rotate(${m.angle} 60 60)"><circle cx="60" cy="60" r="36" fill="${m.color}" stroke="#111" stroke-width="2"/><line x1="60" y1="60" x2="60" y2="30" stroke="#111" stroke-width="4" stroke-linecap="round"/></g></svg>
  <figcaption>knob ${m.n}, mode ${m.name}</figcaption>
</figure>`;
const para = (c) => c.paras.map((p) => `<p>${p}</p>`).join("") + (c.needed ? `<p><span class="needed">content needed</span></p>` : "");
const modeExtra = {
  engineer: `<div class="box"><span class="tiny">2.1.1 compatible outputs</span>${FX.built(window.PRODUCTS)}</div>`,
  founder: `<div class="box"><span class="tiny">2.2.1 readout</span><div class="readout">${ch("founder").numbers.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div></div>`,
  stage: `<div class="box"><span class="tiny">2.3.1 last run: spurhacks 2025</span><div class="readout">${C.events[0].stats.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div><p>full field reports in <a href="#reports">3.0</a>.</p></div>`,
  band: `<p class="mono" style="font-size:13px;color:var(--mute)">note: this mode ships in a later revision.</p>`,
};
const TROUBLE = [
  ["you need something built, fast.", "set knob 01 (engineer). see 2.1 for past outputs, then contact support."],
  ["your event is 3 months out and nothing is booked.", "set knob 03 (stage manager). spurhacks 2025 went from nothing to 1,400+ people in three months."],
  ["you have a startup and need a product or project lead.", "set knob 02 (founder). note: currently building a new company in stealth, so response times may vary."],
  ["you want to hear the band.", "not available in this revision. check back soon."],
  ["the unit is not responding.", "it's probably at an event. email " + C.email + "."],
];

document.getElementById("app").innerHTML = `
<section class="cover">
  <div class="cover-meta tiny"><span>nausher rao</span><span>field manual</span><span>rev. 2026.09</span><span>${C.place}</span></div>
  <div class="model"><h1>NR-26<span>.</span></h1><p>one unit, four modes. software, companies, live events and music.</p></div>
  <div class="diagram">${diagram}</div>
  <div class="cover-foot tiny"><span>read this manual before operating.</span><span>turn a knob to jump to its mode.</span><span>keep for future reference.</span></div>
</section>

<section class="sheet" id="overview">
  ${head("1.0", "overview")}
  <div class="sec"><span class="sec-n">1.0</span><h2>overview</h2>
    <div class="body">
      <p class="lede">${S.standfirst}</p>
      <dl class="specs">
        <div><dt>model</dt><dd>nausher rao (nr-26)</dd></div>
        <div><dt>location</dt><dd>${C.place}</dd></div>
        <div><dt>current firmware</dt><dd>${C.now.role}, ${C.now.org}: ${C.now.focus}</dd></div>
        <div><dt>running since</dt><dd>age 8</dd></div>
        <div><dt>modes</dt><dd>4: engineer, founder, stage manager, bandmate (see 2.0)</dd></div>
        <div><dt>outputs</dt><dd>${window.PRODUCTS.length} products (see 2.1)</dd></div>
        <div><dt>largest audience</dt><dd>1,400+ at spurhacks 2025 (see 3.0)</dd></div>
        <div><dt>in development</dt><dd>a new company, in stealth</dd></div>
        <div><dt>training</dt><dd>${C.education.degree}, ${C.education.school}</dd></div>
      </dl>
    </div>
  </div>
</section>

<section class="sheet" id="modes">
  ${head("2.0", "modes")}
  <div class="sec"><span class="sec-n">2.0</span><h2>modes</h2></div>
  ${MODES.map((m, i) => { const c = ch(m.id); return `
  <div class="mode" id="mode-${m.id}">
    <span class="mode-n">2.${i + 1}</span>
    <div><h3>mode ${m.n}: ${m.name}</h3><p class="how">${m.how}</p>${para(c)}${modeExtra[m.id]}</div>
    ${knobIcon(m)}
  </div>`; }).join("")}
</section>

<section class="sheet" id="reports">
  ${head("3.0", "field reports")}
  <div class="sec"><span class="sec-n">3.0</span><h2>field reports</h2>
    <div class="body"><p class="lede">the unit in use at live events. hover to see a report in colour.</p></div>
  </div>
  <div class="reports">${C.events.map((e, i) => `
    <a href="${e.url}" target="_blank" rel="noopener"><figure>${img(e.photos[0], e.name)}
      <figcaption><span class="tiny">fig. 3.${i + 1}</span><b>${e.name}</b>${e.date}<br>${e.stats.slice(0, 2).map(([b, s]) => `${b} ${s}`).join(", ")}</figcaption></figure></a>`).join("")}
  </div>
</section>

<section class="sheet" id="trouble">
  ${head("4.0", "troubleshooting")}
  <div class="sec"><span class="sec-n">4.0</span><h2>troubleshooting</h2>
    <div class="body"><table class="trouble"><thead><tr><th>problem</th><th>solution</th></tr></thead><tbody>
      ${TROUBLE.map(([p, s]) => `<tr><td>${p}</td><td>${s}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
</section>

<section class="sheet" id="support">
  ${head("5.0", "support")}
  <div class="sec"><span class="sec-n">5.0</span><h2>support</h2>
    <div class="body">
      <a class="support-mail" href="mailto:${C.email}">${C.email}</a>
      <nav class="support-links" aria-label="Elsewhere"><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="${C.links.letterboxd}" target="_blank" rel="noopener">letterboxd</a></nav>
    </div>
  </div>
</section>
<footer class="colophon tiny"><span>nr-26 field manual, rev. 2026.09</span><span>designed and built by nausher rao</span></footer>`;

// Hovering or focusing a knob shows its mode on the display.
(() => {
  const l1 = document.querySelector("[data-screen1]"), l2 = document.querySelector("[data-screen2]");
  const show = (k) => { [l1.textContent, l2.textContent] = SCREEN[k]; };
  document.querySelectorAll(".knob").forEach((k) => {
    k.addEventListener("pointerenter", () => show(k.dataset.mode));
    k.addEventListener("focus", () => show(k.dataset.mode));
    k.addEventListener("pointerleave", () => show("idle"));
    k.addEventListener("blur", () => show("idle"));
  });
})();
</script>
</body>
</html>
