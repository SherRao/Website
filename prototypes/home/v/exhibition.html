<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Exhibition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap">
<script src="../content.js"></script>
<script src="shared.js"></script>
<style>
/* A white-cube gallery: one work at a time, lots of wall, small museum labels. */
:root {
  --wall: #fbfbfa; --ink: #141414; --mute: #767676; --line: #e4e4e2; --floor: #efefed;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pad: clamp(20px, 3vw, 44px);
  --serif: "Cormorant Garamond", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
.small { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.needed { display: inline-block; margin-top: 8px; padding: 2px 7px; border: 1px dashed var(--mute); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }

.top { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 var(--pad); font-size: 13px; background: linear-gradient(var(--wall) 55%, rgba(251, 251, 250, 0)); }
.top b { font-weight: 600; }
.top nav { display: flex; gap: 20px; }
.top nav a { color: var(--mute); text-decoration: none; transition: color 150ms ease; }
.top nav a:hover { color: var(--ink); }

/* ---------- entrance: title wall ---------- */
.entrance { min-height: 100dvh; display: grid; place-items: center; padding: 96px var(--pad) 48px; text-align: center; }
.entrance h1 { margin: 0; font-size: clamp(48px, 7vw, 112px); font-weight: 500; letter-spacing: -0.04em; line-height: 0.95; }
.entrance h1 em { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
.entrance .dates { margin: 18px 0 0; }
.entrance .wall-text { max-width: 560px; margin: 48px auto 0; font-size: 16px; line-height: 1.7; text-align: left; color: #333; }
.entrance .enter { margin-top: 48px; }

/* ---------- rooms and works ---------- */
.room { padding: clamp(120px, 16vh, 200px) var(--pad) 0; scroll-margin-top: 40px; }
.room-sign { max-width: 520px; margin: 0 auto; text-align: center; }
.room-sign h2 { margin: 8px 0 0; font-size: clamp(34px, 3.6vw, 52px); font-weight: 500; letter-spacing: -0.03em; }
.room-sign p { margin: 14px 0 0; font-size: 15.5px; line-height: 1.65; color: #444; }
.work { min-height: 92dvh; display: grid; grid-template-columns: minmax(0, 1fr) 280px; column-gap: clamp(32px, 5vw, 72px); align-items: end; max-width: 1180px; margin: 0 auto; padding: clamp(72px, 12vh, 140px) 0 0; opacity: 0; transform: translateY(16px); transition: opacity 1100ms var(--ease-out), transform 1100ms var(--ease-out); }
.work.is-in { opacity: 1; transform: none; }
.work.flip { grid-template-columns: 280px minmax(0, 1fr); }
.work.flip .art { order: 2; }
.art { display: grid; place-items: center; min-height: 58vh; }
.art img { max-height: 64vh; width: auto; max-width: 100%; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.35); }
.label { padding: 16px 0 6px; border-top: 1px solid var(--ink); font-size: 13.5px; line-height: 1.5; }
.label .who { font-weight: 600; }
.label .title { display: block; margin-top: 2px; font-family: var(--serif); font-size: 23px; font-style: italic; line-height: 1.15; }
.label .title span { font-family: "Hanken Grotesk", sans-serif; font-style: normal; font-size: 13.5px; }
.label dl { margin: 10px 0 0; }
.label dt { display: inline; color: var(--mute); }
.label dd { display: inline; margin: 0; }
.label dd::after { content: ""; display: block; margin-bottom: 3px; }
.label .note { margin: 10px 0 0; color: #444; }
.label a { color: var(--mute); text-decoration: none; }
.label a:hover { color: var(--ink); }

/* works without a photo are made from type or colour */
.piece { display: grid; place-items: center; width: min(62vh, 100%); aspect-ratio: 1; background: #fff; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.3); }
.piece--dot { position: relative; background: #fff; }
.piece--dot i { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(31, 94, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(31, 94, 255, 0.3); }
.piece--dot b { position: absolute; left: 50%; top: 50%; width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: #1f5eff; box-shadow: 0 0 0 5px #fff, 0 2px 10px 4px rgba(0, 0, 0, 0.14); }
.piece--tab { background: #f3f0e8; color: #0e7a54; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; font-size: clamp(56px, 9vh, 96px); }
.piece--type { font-size: clamp(44px, 8vh, 96px); font-weight: 500; letter-spacing: -0.05em; color: #c9c9c6; }
.piece--blank { background: #fff; border: 1px solid var(--line); box-shadow: none; }
.piece--blank span { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }

/* ---------- exit ---------- */
.exit { min-height: 90dvh; display: grid; place-items: center; margin-top: clamp(120px, 16vh, 200px); padding: 64px var(--pad); background: var(--floor); text-align: center; }
.exit h2 { margin: 8px 0 0; font-size: clamp(34px, 3.6vw, 52px); font-weight: 500; letter-spacing: -0.03em; }
.exit a.mail { display: inline-block; max-width: 100%; overflow-wrap: anywhere; margin-top: 20px; font-family: var(--serif); font-size: clamp(30px, 5vw, 72px); font-style: italic; text-decoration: none; }
.exit a.mail:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 8px; }
.exit nav { display: flex; justify-content: center; gap: 22px; margin-top: 20px; font-size: 14px; }
.exit nav a { color: var(--mute); text-decoration: none; }
.exit nav a:hover { color: var(--ink); }
.exit .fine { margin-top: 56px; }

@media (max-width: 900px) {
  .top nav { display: none; }
  .work, .work.flip { grid-template-columns: minmax(0, 1fr); row-gap: 20px; min-height: 0; }
  .work.flip .art { order: 0; }
  .art { min-height: 0; }
  .piece { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .work { opacity: 1; transform: none; transition: none; }
}
</style>
</head>
<body>
<header class="top"><b>nausher rao</b><nav aria-label="Rooms"><a href="#room-1">software</a><a href="#room-2">companies</a><a href="#room-3">live</a><a href="#room-4">sound</a><a href="#exit">visit</a></nav></header>
<main id="app"></main>
<script>
const C = window.CONTENT, S = window.STORY;
const P = (name) => window.PRODUCTS.find((p) => p.name === name);
const E = (id) => C.events.find((e) => e.id === id);
const img = (f, alt = "") => `<img src="../assets/${f}" alt="${alt}">`;

// Each work: the art on the wall, then its label.
const ROOMS = [
  { n: 1, id: "room-1", title: "software", text: "work made from code: things that know where you are, split a bill fairly, or keep a million people's dashboards running. the medium changes; the habit of shipping doesn't.",
    works: [
      { title: "blue dot", years: "2025 to now", art: `<div class="piece piece--dot"><i></i><b></b></div>`, medium: "indoor positioning", dims: "any building where gps gives up", credit: "senior software engineer, mappedin", note: P("blue dot").what, url: P("blue dot").url },
      { title: "tab", years: "2026", art: `<div class="piece piece--tab">tab.</div>`, medium: P("tab").stack, dims: "254 commits, 70 pull requests in the first month", credit: "side project", note: P("tab").what, url: P("tab").url, link: "view source" },
      { title: "shopify cli + partner dashboard", years: "2022 to 2023", art: `<div class="piece piece--type">1,100,000</div>`, medium: P("shopify cli + partner dashboard").stack, dims: "1.1M+ people a day", credit: "software engineer, shopify", note: P("shopify cli + partner dashboard").what, url: P("shopify cli + partner dashboard").url },
    ] },
  { n: 2, id: "room-2", title: "companies", text: "work made from people, money and deadlines. a company, an incubator, a mental health app, and one piece still under wraps.",
    works: [
      { title: "konfer", years: "2024 to now", art: img("spur-bbq-2.jpg", "SPUR x Konfer sign at the BBQ festival"), medium: "people, product, a $350k+ budget", dims: "14 organizers, 43 volunteers", credit: "founder & ceo", note: "the team behind spurhacks, and the platform that ran it.", url: "https://konfer.ca" },
      { title: "spur innovation center", years: "2024 to 2025", art: `<div class="piece piece--type">12/15</div>`, medium: "$1M+ in startup investment", dims: "50+ companies reviewed, 15 picked", credit: "project manager", note: "12 of 15 startups hit their q1 okrs. an investor platform cut onboarding from 3+ months to a couple of weeks." },
      { title: "seahorse", years: "2024", art: `<div class="piece piece--type">$750k</div>`, medium: P("seahorse").stack, dims: "two live demos, $750k raised", credit: "technical product lead, near", note: P("seahorse").what },
      { title: "untitled", years: "2026", art: `<div class="piece piece--blank"><span>not yet on view</span></div>`, medium: "undisclosed", dims: "in progress", credit: "founder", note: "a new company, in stealth. this wall is reserved." },
    ] },
  { n: 3, id: "room-3", title: "live", text: "work made in real time, in front of people. hackathons, a party on the water, a bbq with a live band. most of these lasted three days or less, and took months.",
    works: C.events.map((e) => ({
      title: e.name, years: e.date, art: img(e.photos[0], e.name),
      medium: e.id === "spurhacks" ? "1,400+ people, broadcast av, three months" : "people, a venue, a run of show",
      dims: e.stats.map(([b, s]) => `${b} ${s}`).join(", "),
      credit: e.credits.filter(([r, n]) => n === "nausher rao" && !r.startsWith("budget")).map(([r]) => r).join(", "), note: e.blurb, url: e.url,
    })) },
  { n: 4, id: "room-4", title: "sound", text: "work made with a band. this room is being installed.",
    works: [{ title: "the band", years: "ongoing", art: `<div class="piece piece--blank"><span>on loan, returning soon</span></div>`, medium: "tba", dims: "tba", credit: "bandmate", note: C.band.line, needed: true }] },
];

let k = 0;
const work = (w) => `
<article class="work${k++ % 2 ? " flip" : ""}">
  <div class="art">${w.art}</div>
  <div class="label">
    <span class="who">nausher rao</span>
    <span class="title">${w.title}<span>, ${w.years}</span></span>
    <dl><dt>medium </dt><dd>${w.medium}</dd><dt>dimensions </dt><dd>${w.dims}</dd><dt>role </dt><dd>${w.credit}</dd></dl>
    <p class="note">${w.note}</p>
    ${w.needed ? `<span class="needed">content needed</span>` : ""}
    ${w.url ? `<p style="margin:10px 0 0"><a href="${w.url}" target="_blank" rel="noopener">${w.link || "visit"} ↗</a></p>` : ""}
  </div>
</article>`;

document.getElementById("app").innerHTML = `
<section class="entrance">
  <div>
    <p class="small">a retrospective</p>
    <h1>nausher rao<br><em>one person, four jobs</em></h1>
    <p class="dates small">selected works, 2021 to 2026 / always open / free admission</p>
    <p class="wall-text">${S.standfirst}</p>
    <p class="enter small">enter, scroll</p>
  </div>
</section>
${ROOMS.map((r) => `
<section class="room" id="${r.id}">
  <div class="room-sign"><span class="small">room ${r.n}</span><h2>${r.title}</h2><p>${r.text}</p></div>
  ${r.works.map(work).join("")}
</section>`).join("")}
<section class="exit" id="exit">
  <div>
    <span class="small">visitor information</span>
    <h2>questions about the collection</h2>
    <a class="mail" href="mailto:${C.email}">${C.email}</a>
    <nav aria-label="Elsewhere"><a href="${C.links.github}" target="_blank" rel="noopener">github</a><a href="${C.links.linkedin}" target="_blank" rel="noopener">linkedin</a><a href="${C.links.letterboxd}" target="_blank" rel="noopener">letterboxd</a></nav>
    <p class="fine small">${C.education.degree}, ${C.education.school}. curated by nausher rao.</p>
  </div>
</section>`;

FX.onceInView(".work");
</script>
</body>
</html>
