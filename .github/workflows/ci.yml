name: CI

on:
  push:
    branches: [main]
  # Every pull request, so stacked PRs (based on another branch) are checked too.
  pull_request:

jobs:
  lint:
    name: Static Checks - Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint with ESLint
        run: pnpm lint

  format:
    name: Static Checks - Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check formatting with Prettier
        run: pnpm format:check

  test:
    name: Testing - Unit & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  build:
    name: Build - Type Checking & Stealth Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build (type check + stealth scan)
        run: pnpm build
        env:
          STEALTH_TERMS: ${{ secrets.STEALTH_TERMS }}

  e2e:
    name: Testing - End-to-End
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  commits:
    name: Lint commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Lint commit messages
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FROM="origin/$GITHUB_BASE_REF"
            TO="HEAD"
          else
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ "$AFTER" = "0000000000000000000000000000000000000000" ]; then
              echo "Branch created or deleted; nothing to lint"
              exit 0
            fi
            FROM="$BEFORE"
            TO="$AFTER"
          fi
          pnpm exec commitlint --from "$FROM" --to "$TO"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
