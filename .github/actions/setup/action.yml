name: Setup
description: Install pnpm, Node.js and dependencies.

runs:
  using: composite
  steps:
    # Pinned here rather than with packageManager in package.json, which broke the Vercel build.
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12.14.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
