# Dependabot version updates. Commit prefixes keep Dependabot commits valid for
# commitlint and release-please (conventional commits).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: "npm" # Also covers pnpm-lock.yaml
      directory: "/"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore(deps)"

    - package-ecosystem: "github-actions"
      # "/" covers .github/workflows; composite actions must be listed explicitly
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "ci(deps)"
